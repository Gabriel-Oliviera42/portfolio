	1. As imagens sao cortadas em 16/9 (`object-fit: cover` no components.css).
	   Isso serve pra foto, mas NAO pra captura de tela: uma captura de 1600x1000
	   perde 11% da altura e leva junto a barra de baixo da interface. Se as suas
	   imagens nao forem 16/9, ajuste o aspect-ratio no CSS do projeto:

	       .detail-gallery img { aspect-ratio: 16 / 10; }

	2. `class="is-destaque"` faz a figura ocupar a largura inteira, no meio das

	   So a imagem do topo da pagina (detail-media) fica sem, porque ela aparece
	   de cara.

	Ver docs/08-catalogo-de-blocos.md.
-->
