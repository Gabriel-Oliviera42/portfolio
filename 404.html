<!DOCTYPE HTML>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<script>
			/* O GitHub Pages entrega este arquivo pra QUALQUER endereco que nao
			   existe, inclusive dentro de projects/. Com caminho relativo, em
			   /portfolio/projects/xyz.html o CSS era procurado em projects/assets/
			   (a pagina abria sem estilo) e o botao "Voltar" levava pra
			   projects/index.html, outro 404.

			   A <base> faz todo caminho abaixo partir da raiz do site. Precisa ser
			   criada ANTES dos <link>, por isso fica no topo do <head>. No GitHub
			   Pages a raiz e /portfolio/; em localhost e dominio proprio, e /. */
			(function() {
				var pasta = location.pathname.split("/")[1];
				var raiz = /\.github\.io$/.test(location.hostname) && pasta ? "/" + pasta + "/" : "/";
				var base = document.createElement("base");
				base.href = raiz;
				document.head.appendChild(base);
			})();
		</script>
		<title>Página não encontrada - Gabriel Lourenço</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png" />
		<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
		<link rel="stylesheet" href="assets/css/tokens.css" />
		<link rel="stylesheet" href="assets/css/base.css" />
		<link rel="stylesheet" href="assets/css/components.css" />
		<link rel="stylesheet" href="assets/css/blocks.css" />
	</head>
	<body class="project-detail-page">
		<main id="main" class="not-found-page">
			<div class="not-found-content">
				<p class="eyebrow">Erro 404</p>
				<h1>Essa página fugiu do mapa.</h1>
				<p class="detail-summary">O link que você seguiu não existe (ou mudou de lugar). Volte pra home e encontre o que procura por lá.</p>
				<a href="index.html" class="button primary">Voltar para a home</a>
			</div>
		</main>
        <script src="assets/js/sw-register.js" defer></script>
        <script src="assets/js/konami.js" defer></script>
	</body>
</html>
